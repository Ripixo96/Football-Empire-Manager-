name: Validate Football Empire Godot 4

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/validate-godot.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot 4 headless
        run: |
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.4.1-stable_linux.x86_64
      - name: Parse and import Godot project
        run: |
          godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path godot --quit
      - name: Run project headless
        run: |
          godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --quit-after 3
