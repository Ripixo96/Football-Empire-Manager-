name: Build Football Empire Unity APK

on:
  workflow_dispatch:
  push:
    branches: [ unity-rebuild, unity-from-scratch ]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/build-unity-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Unity project
        uses: actions/checkout@v4

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.0.58f1
          targetPlatform: Android
          buildsPath: build
          buildName: FootballEmpire
          androidExportType: androidPackage

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Football-Empire-Unity-Android-APK
          path: build/Android/**/*.apk
          if-no-files-found: error
